<!DOCTYPE html>
<html>
<head>
    <title>Tables Example</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px;
            float: left;
        }
        th, td {
            border: 1px solid black;
            padding: 8px 15px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        h3 {
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Students Records Table -->
    <table>
        <caption><b>Students Records</b></caption>
        <tr>
            <th>Roll_no</th>
            <th>Name</th>
            <th>Total marks</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>1</td>
            <td>khan</td>
            <td>500</td>
            <td>B</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Nazia</td>
            <td>850</td>
            <td>A+</td>
        </tr>
    </table>

    <!-- Product List Table -->
    <table>
        <caption><b>Product List</b></caption>
        <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Extended</th>
        </tr>
        <tr>
            <td>Hard Disk</td>
            <td>1</td>
            <td>500$</td>
            <td>400$</td>
        </tr>
        <tr>
            <td>Cd Drive</td>
            <td>1</td>
            <td>200$</td>
            <td>500$</td>
        </tr>
        <tr>
            <td>Cds</td>
            <td>10</td>
            <td>20$</td>
            <td>50$</td>
        </tr>
        <tr>
            <th colspan="3">Total Amount</th>
            <th>950 $</th>
        </tr>
    </table>

    <!-- Weather Station Table -->
    <table>
        <caption><b>Weather Station</b></caption>
        <tr>
            <th rowspan="2">Station</th>
            <th colspan="2">Temperature</th>
            <th rowspan="2">Humidity</th>
            <th rowspan="2">Weather</th>
        </tr>
        <tr>
            <th>Max</th>
            <th>Min</th>
        </tr>
        <tr>
            <td>USA</td>
            <td>24</td>
            <td>19</td>
            <td>60%</td>
            <td>cloudy</td>
        </tr>
        <tr>
            <td>Germany</td>
            <td>5</td>
            <td>-1</td>
            <td>70%</td>
            <td>Rainy</td>
        </tr>
    </table>

</body>
</html>
